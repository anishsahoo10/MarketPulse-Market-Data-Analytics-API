version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: marketpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marketpulse}
      POSTGRES_USER: ${DB_USER:-marketpulse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketpulse_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketpulse_user} -d ${DB_NAME:-marketpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketpulse-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-marketpulse}
      DB_USER: ${DB_USER:-marketpulse_user}
      DB_PASSWORD: ${DB_PASSWORD:-marketpulse_secret}
      MARKET_DATA_PROVIDER_TYPE: ${MARKET_DATA_PROVIDER_TYPE:-mock}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-demo}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  postgres_data:
